<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper Minimal</title>
    
    <!-- FAVICON: Mina minimalista embebida en SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='35' fill='%23FF6B6B'/><circle cx='40' cy='40' r='8' fill='%23FFFFFF'/><path d='M50 5 L50 15 M50 85 L50 95 M5 50 L15 50 M85 50 L95 50 M18 18 L25 25 M75 75 L82 82 M18 82 L25 75 M75 18 L82 25' stroke='%23FF6B6B' stroke-width='8' stroke-linecap='round'/></svg>">

    <style>
        :root {
            --bg-color: #F0EEE9;
            --surface: #FFFFFF;
            --cell-hidden: #E3DFD6;
            --cell-revealed: #F9F8F6;
            --text-main: #333333;
            --text-muted: #888888;
            --accent: #FF6B6B;
            --primary: #4ECDC4;
            --success: #A8E6CF;
            
            /* Colores de números */
            --c1: #4ECDC4; --c2: #A8E6CF; --c3: #FFD3B6; --c4: #FFAAA5;
            --c5: #FF8B94; --c6: #C5A3FF; --c7: #9D9D9D; --c8: #333333;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        /* INICIO */
        #start-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; width: 100%; transition: opacity 0.4s ease;
        }
        h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 20px; }
        
        .slider-container { width: 80%; max-width: 300px; text-align: center; margin-bottom: 30px; }
        .difficulty-label { font-size: 20px; font-weight: 800; margin-bottom: 5px; display: block; color: var(--primary); letter-spacing: 2px; }
        .best-time-label { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 20px; display: block; height: 20px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-bottom: 15px;}
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
            background: var(--primary); cursor: pointer; margin-top: -10px;
            box-shadow: 0 4px 10px rgba(78, 205, 196, 0.4); transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--cell-hidden); border-radius: 2px; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 16px 40px;
            border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 20px rgba(78, 205, 196, 0.3); transition: all 0.3s ease; letter-spacing: 1px;
        }
        .btn:active { transform: translateY(2px); }

        /* JUEGO */
        #game-screen {
            display: none; flex-direction: column; width: 100%; height: 100%;
            max-width: 1000px; padding: 20px; box-sizing: border-box; opacity: 0; transition: opacity 0.4s ease;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center; background: var(--surface);
            padding: 15px 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px;
        }
        .stat { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; transition: color 0.3s;}
        .stat.success { color: var(--success); }
        
        .toggle-btn {
            background: var(--cell-hidden); border: none; padding: 10px 20px; border-radius: 20px;
            font-weight: bold; cursor: pointer; transition: background 0.3s; display: flex; gap: 8px; color: var(--text-main);
        }
        .toggle-btn.flag-mode { background: var(--accent); color: white; }

        .board-wrapper { flex-grow: 1; overflow: auto; display: flex; justify-content: center; align-items: center; border-radius: 20px; -webkit-overflow-scrolling: touch; }
        #board { display: grid; gap: 2px; padding: 10px; background: var(--surface); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .cell {
            width: 32px; height: 32px; background: var(--cell-hidden); border-radius: 6px;
            display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 16px;
            cursor: pointer; transition: background 0.15s, transform 0.1s;
        }
        .cell:active { transform: scale(0.85); background: #dcd7cc; }
        .cell.revealed { background: var(--cell-revealed); cursor: default; transform: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);}
        
        .cell.mine { background: var(--accent); }
        .cell.mine::after { content: ''; width: 14px; height: 14px; background: white; border-radius: 50%; }
        .cell.flag::after { content: '▲'; color: var(--accent); font-size: 16px; text-shadow: 0 2px 4px rgba(255,107,107,0.4); }

        .back-btn { background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted); padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; align-self: center; }

        @media (max-width: 500px) {
            .cell { width: 28px; height: 28px; font-size: 14px; }
            .header { padding: 12px 15px; } .stat { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>MINESWEEPER</h1>
        <div class="slider-container">
            <span class="difficulty-label" id="diff-label">EASY</span>
            <span class="best-time-label" id="best-time-label">Mejor tiempo: --</span>
            <input type="range" id="diff-slider" min="0" max="3" value="0" step="1">
        </div>
        <button class="btn" onclick="startGame()">Iniciar</button>
    </div>

    <div id="game-screen">
        <div class="header">
            <div class="stat">⏱ <span id="timer">000</span></div>
            <button id="mode-toggle" class="toggle-btn" onclick="toggleMode()">⛏ DIG</button>
            <div class="stat" id="flag-stat">▲ <span id="flag-count">10</span></div>
        </div>
        <div class="board-wrapper"><div id="board"></div></div>
        <button class="back-btn" onclick="showStartScreen()">SALIR</button>
    </div>

    <script>
        const difficulties = [
            { name: 'EASY', rows: 9, cols: 9, mines: 10, color: 'var(--c1)' },
            { name: 'MEDIUM', rows: 16, cols: 16, mines: 40, color: 'var(--c3)' },
            { name: 'HARD', rows: 16, cols: 30, mines: 99, color: 'var(--c5)' },
            { name: 'EVIL', rows: 24, cols: 30, mines: 160, color: 'var(--c8)' }
        ];

        let bestTimes = JSON.parse(localStorage.getItem('minimalMinesweeperBestTimes')) || {0: null, 1: null, 2: null, 3: null};
        
        let currentDiff = 0, grid = [], revealed = [], flags = [];
        let rows, cols, totalMines, minesLeft, timer = 0, timerInterval;
        let isGameOver = false, firstClick = true, isFlagMode = false, pressTimer = null;

        const slider = document.getElementById('diff-slider');
        const label = document.getElementById('diff-label');
        const bestTimeLabel = document.getElementById('best-time-label');

        function updateStartScreenUI() {
            label.innerText = difficulties[currentDiff].name;
            label.style.color = difficulties[currentDiff].color;
            const record = bestTimes[currentDiff];
            bestTimeLabel.innerText = record ? `Mejor tiempo: ${record}s` : 'Mejor tiempo: --';
        }

        slider.addEventListener('input', (e) => { currentDiff = e.target.value; updateStartScreenUI(); });
        window.onload = updateStartScreenUI;

        function showStartScreen() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
                updateStartScreenUI();
                setTimeout(() => document.getElementById('start-screen').style.opacity = '1', 50);
            }, 400);
        }

        function startGame() {
            const config = difficulties[currentDiff];
            rows = config.rows; cols = config.cols; totalMines = config.mines;
            minesLeft = totalMines; isGameOver = false; firstClick = true; timer = 0; clearInterval(timerInterval);
            
            document.getElementById('timer').innerText = '000';
            updateFlagDisplay();
            
            initGrid(); renderBoard();
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                setTimeout(() => document.getElementById('game-screen').style.opacity = '1', 50);
            }, 400);
        }

        function toggleMode() {
            isFlagMode = !isFlagMode;
            const btn = document.getElementById('mode-toggle');
            btn.innerHTML = isFlagMode ? '▲ FLAG' : '⛏ DIG';
            isFlagMode ? btn.classList.add('flag-mode') : btn.classList.remove('flag-mode');
        }

        function updateFlagDisplay() {
            document.getElementById('flag-count').innerText = minesLeft;
            const stat = document.getElementById('flag-stat');
            minesLeft === 0 ? stat.classList.add('success') : stat.classList.remove('success');
        }

        function initGrid() {
            grid = Array(rows).fill().map(() => Array(cols).fill(0));
            revealed = Array(rows).fill().map(() => Array(cols).fill(false));
            flags = Array(rows).fill().map(() => Array(cols).fill(false));
        }

        function placeMines(firstR, firstC) {
            let minesPlaced = 0;
            while (minesPlaced < totalMines) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                // QoL: Evitar minas en el clic inicial y sus 8 vecinos inmediatos para garantizar una apertura limpia
                if (grid[r][c] !== 'M' && Math.max(Math.abs(r - firstR), Math.abs(c - firstC)) > 1) {
                    grid[r][c] = 'M';
                    minesPlaced++;
                }
            }
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c] === 'M') continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 'M') count++;
                        }
                    }
                    grid[r][c] = count;
                }
            }
            timerInterval = setInterval(() => {
                timer++; document.getElementById('timer').innerText = timer.toString().padStart(3, '0');
            }, 1000);
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.innerHTML = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    cell.addEventListener('mousedown', (e) => handleInteraction(e, r, c));
                    cell.addEventListener('contextmenu', (e) => { e.preventDefault(); handleFlag(r, c); });
                    
                    // QoL: Long-press reducido a 500ms
                    cell.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        if (isGameOver || revealed[r][c]) return;
                        pressTimer = setTimeout(() => {
                            handleFlag(r, c);
                            if(navigator.vibrate) navigator.vibrate(50);
                            pressTimer = null;
                        }, 500); 
                    }, {passive: false});

                    cell.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        if (pressTimer) {
                            clearTimeout(pressTimer); pressTimer = null;
                            handleInteraction({button: 0}, r, c);
                        }
                    }, {passive: false});
                    cell.addEventListener('touchmove', () => { if(pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }, {passive: false});

                    board.appendChild(cell);
                }
            }
            updateBoardVisuals();
        }

        function handleInteraction(e, r, c) {
            if (isGameOver || e.button === 2) return;
            isFlagMode ? handleFlag(r, c) : revealCell(r, c);
        }

        function handleFlag(r, c) {
            if (isGameOver || revealed[r][c]) return;
            flags[r][c] = !flags[r][c];
            minesLeft += flags[r][c] ? -1 : 1;
            updateFlagDisplay();
            updateBoardVisuals();
        }

        function revealCell(r, c) {
            if (isGameOver || revealed[r][c] || flags[r][c]) return;
            if (firstClick) { placeMines(r, c); firstClick = false; }
            revealed[r][c] = true;

            if (grid[r][c] === 'M') { gameOver(false); return; }
            if (grid[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) revealCell(nr, nc);
                    }
                }
            }
            updateBoardVisuals(); checkWin();
        }

        function updateBoardVisuals() {
            const cells = document.getElementById('board').children;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const el = cells[r * cols + c];
                    el.className = 'cell'; el.innerHTML = '';
                    if (revealed[r][c]) {
                        el.classList.add('revealed');
                        if (grid[r][c] === 'M') el.classList.add('mine');
                        else if (grid[r][c] > 0) { el.innerText = grid[r][c]; el.style.color = `var(--c${grid[r][c]})`; }
                    } else if (flags[r][c]) {
                        el.classList.add('flag');
                    }
                }
            }
        }

        function gameOver(win) {
            isGameOver = true; clearInterval(timerInterval);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) { if (grid[r][c] === 'M') revealed[r][c] = true; }
            }
            updateBoardVisuals();
            
            if (win) {
                const currentRecord = bestTimes[currentDiff];
                if (!currentRecord || timer < currentRecord) {
                    bestTimes[currentDiff] = timer;
                    localStorage.setItem('minimalMinesweeperBestTimes', JSON.stringify(bestTimes));
                }
                setTimeout(() => alert(`¡Geometría completada en ${timer}s!`), 300);
            } else {
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]); // Patrón de detonación
                setTimeout(() => alert("Mina detonada. Inténtalo de nuevo."), 300);
            }
        }

        function checkWin() {
            let revealedCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) { if (revealed[r][c]) revealedCount++; }
            }
            if (revealedCount === (rows * cols) - totalMines) gameOver(true);
        }
    </script>
</body>
</html>
